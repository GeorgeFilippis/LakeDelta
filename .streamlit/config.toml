[server]
enableStaticServing = true
headless = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

# ---------------------------------------------------------------------------
# Theme: cool survey-paper light theme and a deep-water dark theme. Fonts are
# self-hosted (static/fonts, SIL Open Font License) so no third-party requests.
# ---------------------------------------------------------------------------
[theme]
font = "Barlow, sans-serif"
headingFont = "Barlow, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["2.25rem", "1.6rem", "1.3rem", "1.1rem", "1rem", "0.95rem"]
baseFontSize = 16
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
chartCategoricalColors = ["#2B6CA3", "#A86A2C", "#8A979F", "#5E8C61", "#7A5C99"]
chartDivergingColors = ["#7C4A12", "#C99A5E", "#C9CFD2", "#7FAFD3", "#245E91"]

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/barlow-latin-400-normal.woff2"
weight = 400
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/barlow-latin-ext-400-normal.woff2"
weight = 400
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/barlow-latin-400-italic.woff2"
weight = 400
style = "italic"

